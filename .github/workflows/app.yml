name: App

# Builds the phone app from the web game with Capacitor.
#  - Android: a debug APK you can install on a phone (download it from the run's Artifacts).
#  - iOS: a simulator build that proves the Xcode project compiles. Installing on an
#    iPhone needs signing with an Apple developer account (see README, "Phone app").
# The first run creates the android/ and ios/ projects and commits them back to the branch.

on:
  push:
    branches: [main, feature/app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Bundle fonts for offline play
        run: bash tools/fetch-fonts.sh
      - name: Build the web game
        run: npm run build
      - name: Create the Android project (first run only)
        id: create
        run: |
          if [ ! -d android ]; then
            npx cap add android
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: App icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#110D18' --splashBackgroundColor '#110D18' --iconBackgroundColorDark '#110D18' --splashBackgroundColorDark '#110D18'
      - name: Portrait only
        run: node tools/patch-native.mjs android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: sigilbound-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save the Android project to the repo (first run only)
        if: steps.create.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Add Android project (generated by CI)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Boot the APK in an Android emulator and check the game starts without errors.
  android-check:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: sigilbound-android-debug
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash -c 'adb install -r app-debug.apk && adb logcat -c && adb shell am start -n com.garionmartsch.sigilbound/.MainActivity && sleep 30 && adb logcat -d > logcat.txt; grep -E "Capacitor/Console|Capacitor/Plugin|AndroidRuntime|chromium" logcat.txt | tail -n 80 > app-log.txt; cat app-log.txt; while IFS= read -r l; do echo "::notice title=game console::$l"; done < <(grep -E "Capacitor/Console" app-log.txt | head -n 9); grep -q "app ready storage=ok haptics=ok back=ok" app-log.txt && ! grep -qE "Uncaught|FATAL EXCEPTION" logcat.txt'

  ios:
    needs: android
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Bundle fonts for offline play
        run: bash tools/fetch-fonts.sh
      - name: Build the web game
        run: npm run build
      - name: Create the iOS project (first run only)
        id: create
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: App icon and splash screen
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#110D18' --splashBackgroundColor '#110D18' --iconBackgroundColorDark '#110D18' --splashBackgroundColorDark '#110D18'
      - name: Portrait only
        run: node tools/patch-native.mjs ios
      - run: npx cap sync ios
      - name: Build for the iOS Simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
      - name: Save the iOS project to the repo (first run only)
        if: steps.create.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git commit -m "Add iOS project (generated by CI)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
